<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        font-family: Arial;
        margin: 0;
      }
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        font-size: 15px;
        padding: 14px 21px;
        border: none;
        border-radius: 8px;
        margin-left: 10px;
        cursor: pointer;
      }
      .chat-input {
        font-size: 15px;
        padding: 14px;
        border-radius: 7px;
        border-width: 1px;

        flex-grow: 1;
      }
      .chat-input-container {
        display: flex;
        justify-content: center;

        margin-bottom: 60px;
      }
      .app-container {
        max-width: 600px;
        margin: auto;

        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }
      .chat-message-bot {
        display: flex;
        justify-content: start;
        align-items: start;
      }
      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }
      .chat-message-profile {
        width: 45px;
      }
      .chat-messages-container {
        margin-top: 20px;
        overflow: scroll;
        flex-grow: 1;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
        <div class="js-container"></div>

        <script src="https://unpkg.com/supersimpledev/react.js"></script>
        <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
        <script src="https://unpkg.com/supersimpledev/babel.js"></script>
        <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
        <script type="text/babel">

            function ChatInput({ chatMessages, setChatMessages}) {
              const [inputText, setInputText] = React.useState('');
              const [isLoading, setIsLoading] = React.useState(false);

              function saveInputText(event) {
                setInputText(event.target.value);
              }

              //3k
              async function sendMessage() {
                if (isLoading || inputText === '') {
                  return;
                }

                setIsLoading(true);


                const newChatMessages = [
                  ...chatMessages,
                  {
                    id: crypto.randomUUID(),
                    message: inputText,
                    sender: 'user'
                  }
                ];

                setChatMessages(newChatMessages);

                setInputText('');

                setChatMessages([
                  ...newChatMessages,
                  {
                    id: crypto.randomUUID(),
                    message: 'Loading...',
                    sender: 'bot'
                  }
                ])

                const response = await Chatbot.getResponseAsync(inputText);
                setChatMessages([
                  ...newChatMessages,
                  {
                    id: crypto.randomUUID(),
                    message: response,
                    sender: 'bot'
                  }
                ]);

                setIsLoading(false);
              }

              function keyDownHandler(event) {
                if (event.key === 'Enter') {
                  sendMessage();
                } else if (event.key === 'Escape') {
                  setInputText('');
                }
              }

              return (
                //3i
                <div className="chat-input-container">
                  <input 
                    placeholder="Send a message to Chatbot" 
                    size="30"
                    onChange={saveInputText}
                    onKeyDown={keyDownHandler}
                    value={inputText}
                    className="chat-input"
                  />
                  <button
                    onClick={sendMessage}
                    className="send-button"
                  >Send</button>
                </div>
              );
            };

            function ChatMessage({ message, sender }) {
              // const message = props.message;
              // const sender = props.sender;
              // const { message, sender } = props;

              // if (sender === "bot") {
              //   return (
              //     <div>
              //       <img src="/robot.png" width="50" />
              //       {message}
              //     </div>
              //   )
              // }

              return (
                <div className={
                  sender === 'user'
                  ? 'chat-message-user'
                  : 'chat-message-bot'
                }>
                  {sender === "bot" && (
                    <img src="/robot.png" className="chat-message-profile" />
                  )}
                  <div className="chat-message-text">
                    {message}
                  </div>
                  {sender === "user" && (
                    <img src="/user.png" className="chat-message-profile" />
                  )}
                </div>
              );
            };

            function ChatMessages({ chatMessages }) {
              const chatMesssagesRef = React.useRef(null);

              React.useEffect(() => {
                const containerElem = chatMesssagesRef.current;
                if (containerElem) {
                  containerElem.scrollTop = containerElem.scrollHeight;
                }
              }, [chatMessages]);

              return (
                <div className="chat-messages-container" ref={chatMesssagesRef}>
                  {chatMessages.map((chatMessage) => {
                    return (
                      <ChatMessage 
                        message={chatMessage.message}
                        sender={chatMessage.sender}
                        key={chatMessage.id}
                      />
                    );
                  })}
                </div>
              );
            }

            function App() {
              const [chatMessages, setChatMessages] = React.useState([]);

              return (
                <div className="app-container">
                  <ChatMessages 
                    chatMessages={chatMessages}
                  />
                  <ChatInput 
                    chatMessages={chatMessages}
                    setChatMessages={setChatMessages}
                  />
                </div>
              );
            };

            const mainContainer = document.querySelector('.js-container');
            ReactDOM.createRoot(mainContainer).render(<App />);

        </script>
  </body>
</html>
